{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — {{ COLLEGE_NAME }} UMS</title>
  <meta name="description" content="Login to {{ COLLEGE_NAME }} Student Portal.">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    .login-page {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: var(--bg);
      border: 2px solid;
      border-color: var(--border-light) var(--border-darkest) var(--border-darkest) var(--border-light);
      padding: 20px;
      width: 340px;
    }
    .login-header {
      background: var(--highlight);
      color: var(--highlight-text);
      padding: 6px 8px;
      font-weight: bold;
      font-size: 13px;
      margin: -20px -20px 16px -20px;
    }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-header">&#9632; {{ COLLEGE_NAME }} — Login</div>

    <div style="text-align:center;margin-bottom:12px;">
      <img src="{% static 'images/college_logo.jpg' %}" alt="Logo" style="width:60px;height:60px;object-fit:contain;border:1px solid #999;">
      <div style="font-size:12px;margin-top:4px;"><b>University Management System</b></div>
    </div>

    {% if messages %}
      {% for msg in messages %}
      <div class="alert alert-{{ msg.tags|default:'info' }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username"><b>Username</b> (Registration Number)</label>
        <input type="text" name="username" id="id_username" class="form-control"
               placeholder="e.g. cs2024001" value="{{ form.username.value|default:'' }}" required autofocus>
      </div>
      <div class="form-group">
        <label for="id_password"><b>Password</b></label>
        <input type="password" name="password" id="id_password" class="form-control"
               placeholder="Enter password" required>
      </div>
      <div style="margin-top:12px;">
        <input type="submit" value="Login" class="btn btn-primary" style="width:100%;">
      </div>
    </form>

    <div style="margin-top:12px;border-top:1px solid #999;padding-top:8px;text-align:center;">
      <small class="text-muted">First time? Use the set-password link from your admin.</small>
    </div>
  </div>
</div>
</body>
</html>
