# Production stack: Caddy (TLS + media) -> gunicorn -> Postgres.
# Start per college with its own project name and env file:
#   docker compose -p <slug> -f docker-compose.prod.yml --env-file deployments/<slug>/.env up -d --build
services:
  web:
    build: .
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DEBUG: "False"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "${DB_NAME:-college_ums}"
      DB_USER: "${DB_USER:-college_ums}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      DB_HOST: "db"
      DB_PORT: "5432"
    expose:
      - "8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "manage.py", "qcluster"]
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DEBUG: "False"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "${DB_NAME:-college_ums}"
      DB_USER: "${DB_USER:-college_ums}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      DB_HOST: "db"
      DB_PORT: "5432"
      Q_WORKERS: "${Q_WORKERS:-2}"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "${DB_NAME:-college_ums}"
      POSTGRES_USER: "${DB_USER:-college_ums}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-college_ums} -d ${DB_NAME:-college_ums}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env, e.g. ums.college.edu}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
