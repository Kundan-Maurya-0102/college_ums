# Local development stack: Postgres + Django. Copy .env.example to .env first.
services:
  web:
    build: .
    env_file: .env
    environment:
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "${DB_NAME:-college_ums}"
      DB_USER: "${DB_USER:-college_ums}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      DB_HOST: "db"
      DB_PORT: "5432"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "${DB_NAME:-college_ums}"
      POSTGRES_USER: "${DB_USER:-college_ums}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-college_ums} -d ${DB_NAME:-college_ums}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  media:
