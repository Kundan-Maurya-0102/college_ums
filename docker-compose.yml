services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env before running docker compose}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-127.0.0.1,localhost}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      PASSWORD_TOKEN_TIMEOUT_HOURS: "${PASSWORD_TOKEN_TIMEOUT_HOURS:-48}"
      CSV_MAX_UPLOAD_MB: "${CSV_MAX_UPLOAD_MB:-5}"
      PORTAL_URL: "http://127.0.0.1:8000"
      COLLEGE_NAME: "College UMS"
      COLLEGE_LOGO: "images/college_logo.jpg"
      PRIMARY_COLOR: "#000080"
      COLLEGE_EMAIL: ""
      COLLEGE_PHONE: ""
      COLLEGE_ADDRESS: ""
      COLLEGE_WEBSITE: ""
      COLLEGE_AFFILIATION: ""
      COLLEGE_ESTABLISHED: ""
      COLLEGE_PRINCIPAL_NAME: ""
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "college_ums"
      DB_USER: "college_ums"
      DB_PASSWORD: "college_ums"
      DB_HOST: "db"
      DB_PORT: "5432"
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "college_ums"
      POSTGRES_USER: "college_ums"
      POSTGRES_PASSWORD: "college_ums"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

