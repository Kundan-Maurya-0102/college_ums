services:
  - type: web
    name: college-ums
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn college_ums.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60"
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PASSWORD_TOKEN_TIMEOUT_HOURS
        value: "48"
      - key: CSV_MAX_UPLOAD_MB
        value: "5"
      - key: PORTAL_URL
        value: "https://YOUR-RENDER-SERVICE.onrender.com"
      - key: COLLEGE_NAME
        value: "My College"
      - key: COLLEGE_LOGO
        value: "images/college_logo.jpg"
      - key: PRIMARY_COLOR
        value: "#000080"
      - key: COLLEGE_EMAIL
        value: ""
      - key: COLLEGE_PHONE
        value: ""
      - key: COLLEGE_ADDRESS
        value: ""
      - key: COLLEGE_WEBSITE
        value: ""
      - key: COLLEGE_AFFILIATION
        value: ""
      - key: COLLEGE_ESTABLISHED
        value: ""
      - key: COLLEGE_PRINCIPAL_NAME
        value: ""
      - key: SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: "django.db.backends.postgresql"
      - key: DB_NAME
        fromDatabase:
          name: college-ums-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: college-ums-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: college-ums-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: college-ums-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: college-ums-db
          property: port

databases:
  - name: college-ums-db
    plan: free

